plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.breackneck.mysecondprojectmoneybox"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "4.3"
        setProperty("archivesBaseName", "SimpleSave-v$versionName($versionCode)")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

    namespace 'com.breackneck.mysecondprojectmoneybox'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //Clean Architecture
    implementation project(path: ':domain')
    implementation project(path: ':data')

    //Koin
    def koin_version = "4.2.2"
    implementation "io.insert-koin:koin-core:$koin_version"
    implementation "io.insert-koin:koin-android:$koin_version"

    //Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Keep AppMetrica at its latest version; Yandex Mobile Ads requires AppMetrica 8.6.0+.
    implementation 'io.appmetrica.analytics:analytics:8.6.0'

    // Yandex Mobile Ads: latest version, enforced by the SDK's lint check in release builds.
    implementation 'com.yandex.android:mobileads:8.6.0'
}
